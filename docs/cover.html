<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Human Typer Cover</title>
    <style>
      html, body { margin: 0; }
      body {
        width: 1280px; height: 640px; box-sizing: border-box; padding: 84px 92px;
        background: #f4efe6; color: #1d1b18;
        font-family: "SF Mono", Menlo, monospace;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .line { font-size: 74px; line-height: 1.3; letter-spacing: -0.02em; white-space: nowrap; }
      .typo { color: #c8391f; text-decoration: line-through; text-decoration-thickness: 5px; }
      .fix { color: #1d1b18; border-bottom: 6px solid #c8391f; }
      .caret { display: inline-block; width: 8px; height: 76px; margin-left: 6px; vertical-align: -12px; background: #1d1b18; }
      .keys { font-size: 26px; color: #6d675d; margin-top: 26px; }
      .keys b { color: #c8391f; font-weight: 500; }
      h1 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 12px 0 0; font: 400 28px/1.4 "PingFang SC", sans-serif; color: #4b463e; }
    </style>
  </head>
  <body>
    <div>
      <div class="line">Hello, <span class="typo">wrold</span> <span class="fix">world</span><span class="caret"></span></div>
      <div class="keys">w r o l d <b>⌫ ⌫ ⌫ ⌫</b> o r l d</div>
    </div>
    <div>
      <h1>Human Typer</h1>
      <p>像真人一样打字、打错、再改回来，用于演示和录屏。</p>
    </div>
  </body>
</html>
